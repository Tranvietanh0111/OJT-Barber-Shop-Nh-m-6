# MySQL cho môi trường phát triển. Chạy: docker compose up -d
services:
  db:
    image: mysql:8.0
    container_name: barberhub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: barberhub
    ports:
      - "3306:3306"
    volumes:
      - barberhub_db:/var/lib/mysql
volumes:
  barberhub_db:
